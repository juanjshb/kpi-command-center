name: Backend
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kpi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kpi_command_center_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kpi -d kpi_command_center_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-signing-secret-never-use-in-production-123456
      DATABASE_URL: postgresql+psycopg2://kpi:ci-only-password@localhost:5432/kpi_command_center_test
      TEST_DATABASE_URL: postgresql+psycopg2://kpi:ci-only-password@localhost:5432/kpi_command_center_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: alembic downgrade base
      - run: alembic upgrade head
