<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BHD Leon | Jobs de datos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/dashboard/assets/css/dashboard.css">
  <script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script defer src="/dashboard/config.js"></script>
  <script defer src="/dashboard/assets/js/app.js"></script>
</head>
<body class="dashboard-body" data-page="jobs">
  <div class="shell">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="workspace">
      <header id="topbar" class="topbar"></header>
      <section id="notice" class="notice" hidden></section>
      <section id="kpi-grid" class="kpi-grid"></section>

      <section class="dashboard-grid">
        <article class="panel span-5 job-action-panel">
          <div class="job-icon"><i class="bi bi-cloud-arrow-down"></i></div>
          <div class="job-action-copy">
            <p class="eyebrow">Fuente oficial</p>
            <h2>Ubicaciones Banco BHD</h2>
            <p>Actualiza sucursales, cajeros automáticos y subagentes desde el API público de BHD. La carga actualiza por identificador externo y no duplica registros.</p>
          </div>
          <button id="run-bhd-job" class="primary-button job-run-button" type="button">
            <i class="bi bi-play-fill"></i>
            Ejecutar actualización
          </button>
          <p id="job-permission-note" class="panel-copy"></p>
        </article>

        <article class="panel span-7 job-current-panel">
          <div class="panel-header">
            <h2>Ejecución actual</h2>
            <button class="icon-button refresh-button" type="button" title="Actualizar"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
          <div id="current-job" class="current-job"></div>
        </article>

        <article class="panel span-12">
          <div class="panel-header">
            <div>
              <h2>Historial de ejecuciones</h2>
              <p class="panel-copy">Las últimas sincronizaciones lanzadas desde el dashboard.</p>
            </div>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="jobs-table"></table>
          </div>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
