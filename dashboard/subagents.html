<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BHD Leon | Subagentes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/dashboard/assets/css/dashboard.css">
  <script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script defer src="/dashboard/config.js"></script>
  <script defer src="/dashboard/assets/js/app.js"></script>
</head>
<body class="dashboard-body" data-page="subagents">
  <div class="shell">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="workspace">
      <header id="topbar" class="topbar"></header>
      <section id="notice" class="notice" hidden></section>
      <section id="kpi-grid" class="kpi-grid"></section>

      <section class="dashboard-grid">
        <article class="panel span-8 panel-map">
          <div class="panel-header">
            <h2>Red de subagentes BHD</h2>
            <button class="icon-button refresh-button" type="button" title="Actualizar"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
          <div id="subagent-map" class="map-canvas map-large"></div>
          <div id="subagent-map-legend" class="map-legend"></div>
        </article>

        <article class="panel span-4">
          <div class="panel-header"><h2>Calidad del inventario</h2></div>
          <div id="subagent-quality" class="mini-stack"></div>
        </article>

        <article class="panel span-12">
          <div class="panel-header panel-header-wrap">
            <div>
              <h2>Directorio de subagentes</h2>
              <p class="panel-copy" id="subagent-table-note">Cargando inventario...</p>
            </div>
            <form id="subagent-search-form" class="inline-search" role="search">
              <label class="sr-only" for="subagent-search">Buscar subagente</label>
              <input id="subagent-search" type="search" maxlength="100" placeholder="Nombre, código o dirección">
              <button class="secondary-button" type="submit"><i class="bi bi-search"></i> Buscar</button>
            </form>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="subagent-table"></table>
          </div>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
