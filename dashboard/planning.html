<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location Planning | KPI Command Center</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/dashboard/assets/css/dashboard.css">
  <script defer src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script defer src="/dashboard/config.js"></script>
  <script defer src="/dashboard/assets/js/app.js"></script>
</head>
<body class="dashboard-body" data-page="planning">
  <div class="shell">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="workspace">
      <header id="topbar" class="topbar"></header>
      <section id="notice" class="notice" hidden></section>
      <section id="kpi-grid" class="kpi-grid"></section>

      <section class="dashboard-grid">
        <article class="panel span-8 panel-map">
          <div class="panel-header">
            <h2>Map of Dominican Republic</h2>
            <button class="icon-button refresh-button" type="button" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
          </div>
          <div id="planning-map" class="map-canvas map-large"></div>
          <div id="planning-map-legend" class="map-legend"></div>
        </article>

        <article class="panel span-4">
          <div class="panel-header"><h2>Branch density by province</h2></div>
          <canvas id="planning-density-chart" class="chart-tall"></canvas>
        </article>

        <article class="panel span-5">
          <div class="panel-header"><h2>Location ranking table</h2></div>
          <div class="table-wrap">
            <table class="data-table" id="candidate-table"></table>
          </div>
        </article>

        <article class="panel span-4">
          <div class="panel-header"><h2>Competitor analysis grid</h2></div>
          <div id="planning-comparison-matrix" class="matrix"></div>
        </article>

        <article class="panel span-3">
          <div class="panel-header"><h2>Market focus</h2></div>
          <div id="planning-alerts" class="mini-stack"></div>
        </article>
      </section>
    </main>
  </div>
</body>
</html>
