[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kpi-command-center"
version = "0.1.0"
description = "API del centro de control operativo bancario"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "psycopg2-binary>=2.9.10,<3", "alembic>=1.14,<2",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
  "PyJWT>=2.10,<3", "pwdlib[bcrypt]>=0.2,<1", "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2", "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
